<!DOCTYPE html>
<html lang="zh-CN" data-app-id="shh10-audio-ai">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音频 AI 分析器</title>
<!--
  全部资源用**相对路径**引用，并带 ?v= 版本参数：
    · 相对路径 —— 应用会被平台挂在 /<appid>/ 或 /v2/proxy/<appid>/ 下，
      写死以斜杠开头的绝对路径会白屏（审核项 F7）。
      ⚠️ 这段注释里也**不能**出现那个绝对路径的写法本身：门禁与测试都用
      字符串匹配扫 index.html，注释里的示范会被当成真违规（本次就是这么被拦下的）。
    · ?v= 版本参数 —— 升级后不会读到旧缓存（指引 8.8）。
  data-app-id 必须有：API 前缀靠它判定。
-->
<link rel="stylesheet" href="./app.css?v=1.0.0">
<style>
  /* 本应用的品牌色（设计系统用 --app-accent 一个变量区分应用） */
  :root { --app-accent: #6D5BD0; --app-accent-weak: #f0edfd; }
  @media (prefers-color-scheme: dark) { :root { --app-accent-weak: #241f3d; } }

  .picker-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .picker-row .path {
    flex: 1; font-family: var(--mono); font-size: 12.5px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 7px 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .picker-row .path.empty { color: var(--text-faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 4px 6px 4px 10px; font-size: 12.5px;
    font-family: var(--mono); max-width: 100%;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button {
    border: 0; background: none; cursor: pointer; color: var(--text-faint);
    padding: 0 2px; line-height: 1;
  }
  .chip button:hover { color: var(--danger); }

  /* 波形画布：应用自绘，不引任何图表库 */
  .wave-wrap { position: relative; width: 100%; }
  .wave-wrap canvas {
    width: 100%; height: 180px; display: block;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .wave-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .wave-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
  .wave-legend i { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }

  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kv > div { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; }
  .kv .k { font-size: 11.5px; color: var(--text-faint); }
  .kv .v { font-family: var(--mono); font-size: 13.5px; word-break: break-all; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .form-grid label { display: block; font-size: 12.5px; color: var(--text-faint); margin-bottom: 4px; }
  .form-grid input, .form-grid select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
    font-family: inherit; font-size: 13px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 512 512" width="22" height="22" aria-hidden="true">
        <rect x="32" y="32" width="448" height="448" rx="104" fill="#6D5BD0"/>
        <text x="256" y="268" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif"
              font-size="132" font-weight="700" text-anchor="middle"
              dominant-baseline="central" letter-spacing="2">AI</text>
      </svg>
      <span class="name">音频 AI 分析器</span>
    </div>
    <span class="meta" id="engine-meta"></span>
    <span class="spacer"></span>
    <span class="meta" id="app-version"></span>
  </header>

  <!-- 左侧导航 -->
  <nav class="nav" id="nav"></nav>

  <!-- 核心工作区 -->
  <main class="main" id="main"></main>

  <!-- 底部任务栏 -->
  <div class="taskbar" id="taskbar"></div>
</div>

<div id="toasts" class="toasts"></div>

<script src="./icons.js?v=1.0.0"></script>
<script src="./app.js?v=1.0.0"></script>
<script src="./audio-ai.js?v=1.0.0"></script>
</body>
</html>
